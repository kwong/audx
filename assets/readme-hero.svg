<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">audx hero image</title>
  <desc id="desc">A dark glass audx app icon with a headphones glyph beside the audx name and macOS menu bar utility tagline.</desc>
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F7FA"/>
      <stop offset="52%" stop-color="#DFE6EE"/>
      <stop offset="100%" stop-color="#CAD5DF"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="35%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconBgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2A2A2A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="iconHighlight" cx="50%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#1B2530" flood-opacity="0.24"/>
    </filter>
    <filter id="glyphShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="44" fill="url(#heroBg)"/>
  <rect width="1280" height="640" rx="44" fill="url(#heroGlow)"/>

  <g transform="translate(122 118)" filter="url(#softShadow)">
    <rect x="0" y="0" width="404" height="404" rx="96" fill="url(#iconBgGrad)"/>
    <ellipse cx="202" cy="102" rx="150" ry="75" fill="url(#iconHighlight)"/>
    <rect x="2" y="2" width="400" height="400" rx="94" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
    <g transform="translate(0 0) scale(0.3945)" filter="url(#glyphShadow)" stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 330,540 A 182,182 0 0,1 694,540" stroke-width="34"/>
      <line x1="330" y1="540" x2="330" y2="580" stroke-width="34"/>
      <line x1="694" y1="540" x2="694" y2="580" stroke-width="34"/>
      <rect x="295" y="565" width="70" height="120" rx="28" ry="28" stroke-width="28" fill="#FFFFFF"/>
      <rect x="659" y="565" width="70" height="120" rx="28" ry="28" stroke-width="28" fill="#FFFFFF"/>
    </g>
  </g>

  <g transform="translate(594 188)">
    <text x="0" y="88" fill="#17212B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="96" font-weight="750">audx</text>
    <text x="4" y="150" fill="#4B5B68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="500">Fast audio switching for the macOS menu bar</text>
    <g transform="translate(4 202)" fill="#23313D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600">
    </g>
  </g>
</svg>
