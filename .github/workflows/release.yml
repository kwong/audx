name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and package
        run: |
          chmod +x build.sh package.sh
          VERSION=$VERSION ./package.sh

      - name: Verify bundle version matches tag
        run: |
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' audx.app/Contents/Info.plist)"
          test "$ACTUAL_VERSION" = "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            audx-${{ env.VERSION }}.pkg
            audx-${{ env.VERSION }}.dmg
          generate_release_notes: true
